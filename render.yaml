services:
  - type: web
    name: stream-admin-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_BASE_URL
        sync: false
